<style>

.lot .grid{grid-template-columns:repeat(3,1fr)}

.costcard>span{font-size:11.5px;color:#5c564b;line-height:1.4;margin-bottom:3px}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;align-items:baseline}

.row2{display:flex;gap:8px;justify-content:flex-end}

.wide{width:100%;padding:11px}.scan{background:#f4eedf;border-radius:10px;padding:12px;text-align:center;animation:pulse 1s infinite alternate}

header{padding-top:calc(9px + env(safe-area-inset-top))}

<body>
<div id="app">
  <header>
    <div class="top">
      <h1><small>Pretend money · rules mode<button id="aiChip" style="display:none"></button></small>Global General Needs</h1>
      <div class="clockbox"><div class="clock"><b id="clk">9:00 AM</b><span id="clkLbl">DAY 1</span></div><button id="speedBtn">1×</button><button id="setBtn" aria-label="Settings">⚙️</button></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sCash">$1,000</b><span>Cash</span></div>
      <div class="stat"><b id="sPay">$0</b><span>Payout</span></div>
      <div class="stat"><b id="sStock">0</b><span>In stock</span></div>
      <div class="stat"><b id="sSold">0</b><span>Sold</span></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas><div id="card"><div id="cardInfo"></div><div id="cardBtns"></div></div><div id="toast"></div><div id="loading">Loading your company…</div>
    <div class="zoom"><button id="zin">+</button><button id="zout">−</button></div>
  </div>
  <footer>
    <div id="log"></div>
    <div class="nav">
      <button id="navRep">📋 Reports<span id="repBadge" style="display:none">0</span></button>
      <button id="navProd">📦 Stock</button>
      <button id="navTeam">👥 Team</button>
      <button id="navAI" style="display:none">🧠 AI</button>
      <button id="btnWhistle" class="alt" style="display:none">📣</button>
    </div>
  </footer>
  <div id="sheet">
    <div class="sh"><div class="tabs"><button data-t="reports">📋 Reports</button><button data-t="products">📦 Stock</button><button data-t="team">👥 Team</button><button data-t="settings">⚙️</button></div><button id="sheetClose">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), cardEl = document.getElementById('card');
const W = 24, H = 25, WALL = 80;
let scale = .7, offX = 0, offY = 0, dpr = 1, viewW = 0, viewH = 0, inited = false;

// ================= helpers =================
const iso = (x,y,z=0) => [(x-y)*32, (x+y)*16 - z];
function poly(pts, fill){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return `rgb(${c(n>>16)},${c(n>>8&255)},${c(n&255)})`; }
function box(x,y,w,d,h,col,z0=0,top){
  poly([iso(x,y+d,z0),iso(x+w,y+d,z0),iso(x+w,y+d,z0+h),iso(x,y+d,z0+h)], shade(col,.86));
  poly([iso(x+w,y,z0),iso(x+w,y+d,z0),iso(x+w,y+d,z0+h),iso(x+w,y,z0+h)], shade(col,.7));
  poly([iso(x,y,z0+h),iso(x+w,y,z0+h),iso(x+w,y+d,z0+h),iso(x,y+d,z0+h)], top||col);
}
const rectY = (x0,x1,y,z0,z1,c)=>poly([iso(x0,y,z0),iso(x1,y,z0),iso(x1,y,z1),iso(x0,y,z1)],c);  // on a plane y=const
const rectX = (x,y0,y1,z0,z1,c)=>poly([iso(x,y0,z0),iso(x,y1,z0),iso(x,y1,z1),iso(x,y0,z1)],c);  // on a plane x=const
function textY(x,y,z,txt,font,col,align='left'){ const [sx,sy]=iso(x,y,z); ctx.save(); ctx.translate(sx,sy); ctx.transform(1,.5,0,1,0,0);

function textX(x,y,z,txt,font,col,align='left'){ const [sx,sy]=iso(x,y,z); ctx.save(); ctx.translate(sx,sy); ctx.transform(1,-.5,0,1,0,0);

// ================= pathfinding =================
function passable(cx,cy,nx,ny){
  if(nx<0||ny<0||nx>=W||ny>=H||blocked[ny*W+nx]) return false;
  const dx=nx-cx, dy=ny-cy;
  if(dx&&dy) return passable(cx,cy,nx,cy)&&passable(nx,cy,nx,ny)&&passable(cx,cy,cx,ny)&&passable(cx,ny,nx,ny);
  if(dx===1) return !vW.has(nx+','+cy); if(dx===-1) return !vW.has(cx+','+cy);
  if(dy===1) return !hW.has(cx+','+ny); return !hW.has(cx+','+cy);
}
function astar(sx,sy,tx,ty){
  const N=W*H, g=new Float32Array(N).fill(1e9), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const hh=i=>{const dx=Math.abs(i%W-tx),dy=Math.abs(((i/W)|0)-ty);return Math.max(dx,dy)+.414*Math.min(dx,dy);};
  const s=sy*W+sx, t=ty*W+tx, open=[s]; g[s]=0;
  while(open.length){
    let bi=0,bf=1e9; for(let k=0;k<open.length;k++){const f=g[open[k]]+hh(open[k]); if(f<bf){bf=f;bi=k;}}
    const cur=open.splice(bi,1)[0]; if(closed[cur]) continue; closed[cur]=1;
    if(cur===t){ const p=[]; let c=cur; while(c!==-1){ p.push([c%W+.5,((c/W)|0)+.5]); c=came[c]; } return p.reverse(); }
    const cx=cur%W, cy=(cur/W)|0;
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){ if(!dx&&!dy) continue;
      const nx=cx+dx, ny=cy+dy; if(!passable(cx,cy,nx,ny)) continue;
      const n=ny*W+nx, ng=g[cur]+(dx&&dy?1.414:1); if(ng<g[n]){ g[n]=ng; came[n]=cur; open.push(n); } }
  }
  return null;
}
function walkTo(a, cx, cy, next){
  const p = astar(Math.floor(a.x),Math.floor(a.y),Math.floor(cx),Math.floor(cy));

function refundBook(p,amount,product){ G.pending-=amount; G.total.refunds+=amount; ledger({t:'refund',item:product,mk:p?(p.channel||'amazon'):'',qty:1,amt:-amount});

  l.markets.amazon.why=ruleWhy(l); l.markets.amazon.pass=!l.markets.amazon.why.length;
  for(const m of ['walmart','ebay']){ const x=l.markets[m]; x.why=(x.why||[]).filter(w=>w!=='ROI under 25%'); if(x.roi<.25) x.why.push('ROI under 25%'); x.pass=!x.why.length; }
  l.best=bestMarket(l); l.market=l.best||'amazon'; }
function freshLead(snap){ const l=JSON.parse(JSON.stringify(snap)); l.id=G.nid++; l.foundAt=now(); l.checkedAt=now(); delete l.hot; delete l.expiresAt; delete l.pendingChange; l.decision=null; l.qty=0; delete l.rex; delete l.ivy; delete l.scout; l.ipFail=false; return l; }
function leadSnap(l){ const x=JSON.parse(JSON.stringify(l)); delete x.decision; delete x.rex; delete x.ivy; delete x.scout; return x; }
function restockScan(p,who,manual){
      const l=freshLead(p.leadSnap); const ch=p.channel||'amazon', orig=p.lead.store;

      for(const st of STORES.filter(x=>x!==orig).sort(()=>Math.random()-.5).slice(0,4)) sources.push({store:st, oos:Math.random()<.2, price:r2(p.cost*rr2(.82,1.18))});

      const origLine = o.oos ? `${orig} (where you bought it) is out of stock right now.` : o.price===p.cost ? `${orig} still has it at ${$$(o.price)}, the same as you paid.` : `${orig} now has it at ${$$(o.price)} (you paid ${$$(p.cost)}).`;
      const cheapLine = !inStock.length ? 'None of the stores I checked have it in stock.' : inStock[0].store!==orig ? `Cheapest today: ${inStock[0].store} at ${$$(inStock[0].price)}${o.oos?'':`, ${$$(o.price-inStock[0].price)} less per unit than ${orig}`}.` : `${orig} is still the cheapest of ${inStock.length} stores checked.`;

      const summary=head+`${origLine} ${cheapLine} `+
        (ok?`At the cheapest price it still meets your rules${l.best?`, best on ${MKT_LABEL[l.best]} at ${Math.round(l.markets[l.best].roi*100)}% ROI`:''}. Want to reorder?`:inStock.length?`It no longer meets your rules (${(l.markets[ch].why||[]).join(', ')}), so I'd hold off.`:'I’ll check again on the next sell-out.');

// popular = sold out within a week of going live, or selling 1.5+ a day
function isPopular(p){ const live=p.liveAt?Math.max(.25,now()-p.liveAt):null; return live!=null && (live<=7 || p.qty/live>=1.5); }
function restockAlert(p){ const who=p.foundBy&&hiredA(p.foundBy)?p.foundBy:'scout';
  const {l,ok}=restockScan(p,who); const rp=oneLeadReport('restock',who,l,l.scout.note,{alert:true}); l.qty=ok?suggestQtyM(l,l.market):0;
  notify(`🚨 Restock alert: ${p.name} sold out ${p.soldOutIn!=null?`in ${p.soldOutIn} day${p.soldOutIn===1?'':'s'}`:'fast'} on ${MKT_LABEL[p.channel||'amazon']}. Tap Reports to reorder.`); markSave(); return rp; }
function queueRestock(p){ if(!p.leadSnap||p.restockQueued) return; const profit=p.net-p.qty*(p.cost+p.lead.prep); if(profit<=0) return;

function nearMiss(l){ let best=null;

    const need=r2((x.price-x.fees-(x.ship||0)-l.prep)/1.25); if(need>0&&(!best||need>best.cost)) best={m,cost:need,roiNow:x.roi}; }

function addToWatch(l,who){ const W=G.watch=G.watch||[]; if(W.some(w=>w.lead.name===l.name&&w.lead.store===l.store)) return;

// ---------- daily digest: one report per bot per day ----------
function digestFor(owner){ const D=G.digest=G.digest||{}; return D[owner]=D[owner]||{leads:[],moves:[],checked:0,fails:{},removed:{ip:0,unstable:0}}; }
function digestAdd(owner,leads){ const D=digestFor(owner), key=l=>l.name+'|'+l.store;
  for(const l of leads){ const i=D.leads.findIndex(x=>key(x)===key(l)); if(i>=0){ if(bestROI(l)>bestROI(D.leads[i])||l.restock||l.watchHit) D.leads[i]=l; } else D.leads.push(l); }
  D.leads.sort((a,b)=>bestROI(b)-bestROI(a)); if(D.leads.length>15) D.leads.length=15; }
function sendDigest(owner,onDemand){
  const D=(G.digest||{})[owner]; const nm=(ROLES.find(r=>r.key===owner)||{name:'Scout'}).name;
  if(!D||(!D.leads.length&&!D.moves.length)){ if(onDemand) notify(`📋 ${nm}: nothing that passes your rules yet today. I'll keep looking.`); return null; }
  let gone=0, nolonger=0, changed=0; const leads=[];
  for(const l of D.leads){ if(leads.length>=5) break; const r=recheck(l);
    if(r.gone){ gone++; continue; } if(r.changed){ changed++; if(!passesAny(l)){ nolonger++; continue; } } leads.push(l); }
  leads.sort((a,b)=>bestROI(b)-bestROI(a));
  const extra=Math.max(0,D.leads.length-gone-nolonger-leads.length);
  if(!leads.length&&!D.moves.length){ delete G.digest[owner]; log(`🔍 ${nm} re-checked today's finds before sending: all sold out or changed (${gone} sold out, ${nolonger} no longer pass)`); if(onDemand) notify(`📋 ${nm}: today's finds all sold out or changed. Still looking!`); markSave(); return null; }

    removed:{...D.removed, rexOn:!!hiredA('rex'), ivyOn:!!hiredA('ivy')},
    summary:`Today's report: ${parts.join(', ')}.${extra>0?` ${extra} more passed but didn't make the top 5.`:''} I re-checked every price right before sending${gone||changed?`: ${[gone?gone+' sold out':'',changed?changed+' changed price':'',nolonger?nolonger+' no longer passed and were dropped':''].filter(Boolean).join(', ')}`:', and nothing changed'}. Highest ROI first.`};
  for(const r of G.reports) if(r.type==='products'&&r.digest&&r.owner===owner){   // yesterday's deals expire when the new report arrives

function recheck(l){   // live price / stock check (older finds change more often)

  history:{

const LOT_REQ={maxPctRetail:.25, minROI:.5};
const LOT_KEYS=['pct','roi','cond','manifest'];

const LOT_SOURCES=['Liquidation.com','B-Stock','Salvex','BULQ','Whatnot'];
const LOT_CATS=['Home & kitchen','Toys & games','Small electronics','Apparel & shoes','Tools & hardware','Mixed merchandise','Health & beauty'];
const LOT_COND=[{c:'New overstock',rec:.5},{c:'Shelf pulls',rec:.42},{c:'Customer returns',rec:.3},{c:'Salvage / untested',rec:.14}];
function makeLot(){
  const cond=pick(LOT_COND), units=Math.round(rr2(20,140)), retail=Math.round(units*rr2(12,55));
  const bid=Math.round(retail*rr2(.04,.26)), freight=Math.round(rr2(90,360)), allIn=Math.round(bid*1.12+freight);
  const estResale=Math.round(retail*cond.rec*rr2(.85,1.15)), fees=estResale*.1325+units*4, profit=Math.round(estResale-fees-allIn);
  const l={id:G.nid++, source:pick(LOT_SOURCES), category:pick(LOT_CATS), condition:cond.c, units, retail, bid, freight, allIn, estResale, profit,
    roi:r2(profit/allIn), pctRetail:r2(allIn/retail), manifest:Math.random()<.8?'Full manifest':'Partial manifest',
    truth:r2(rr2(.6,1.15)*(cond.c.startsWith('Salvage')?.8:1)), decision:null};
  l.rules={pct:l.pctRetail<=LOT_REQ.maxPctRetail, roi:l.roi>=LOT_REQ.minROI, cond:!cond.c.startsWith('Salvage'), manifest:l.manifest==='Full manifest'};
  return l;
}
const lotPasses=l=>LOT_KEYS.every(k=>l.rules[k]);

function approveLot(rep,l){
  if(l.allIn>G.cash+1e-6) return;
  G.cash-=l.allIn; G.total.spent+=l.allIn; l.decision={bid:true}; ledger({t:'lot',item:`${l.category} lot (${l.units})`,mk:l.source,qty:l.units,amt:-l.allIn});
  const L={id:G.nid++, lot:l, name:`${l.category} lot (${l.units})`, allIn:l.allIn, units:l.units, stage:'bidding', t:0, sold:0, sellable:0, revenue:0, net:0, lastTended:0};
  G.lots.unshift(L); log(`🔨 You approved a bid on ${L.name} (${$0(l.allIn)} held)`);
  queueTask('liq',{kind:'bid',title:'Place bid: '+L.name,dur:6,ref:L.id});
  markSave(); updStats();
}

  if(w.queue.some(x=>x.kind==='wmlist'&&x.ref===p.id)||(w.task&&w.task.kind==='wmlist'&&w.task.ref===p.id)) return;
  queueTask('walmart',{kind:'wmlist',title:'List on Walmart: '+p.name,dur:6,ref:p.id}); }

function simLots(dd){
  for(const L of G.lots||[]){
    if(L.stage==='freight'){ L.t-=dd; if(L.t<=0){ L.stage='arrived'; notify(`🚛 ${L.name} arrived at the warehouse`);
      if(hiredA('ebay')) queueTask('ebay',{kind:'listlot',title:'List lot on eBay: '+L.name,dur:8,ref:L.id}); else log(`⚠️ ${L.name} is waiting. Hire Eli (eBay) to sell it.`); markSave(); } }
    else if(L.stage==='selling'){
      const tended=now()-L.lastTended<=1.5 ? 1 : .3;
      let exp=(L.sellable-L.sold)*.075*tended*dd;
      while(exp>0 && L.sold<L.sellable){ if(Math.random()<Math.min(1,exp)){ const price=r2(L.unitPrice*rr2(.8,1.12)), net=price*(1-.1325)-4;
          L.sold++; L.revenue+=price; L.net+=net; statAdd(L.lot.source,L.name,'ebay',1,net-L.allIn/Math.max(1,L.sellable)); ledger({t:'sale',item:L.name,mk:'ebay',qty:1,amt:price,fee:-(price-net)}); G.pending+=net; G.total.units++; G.total.revenue+=price; G.total.net+=net; G.today.units++; G.today.revenue+=price; G.today.net+=net; }
        exp-=1; }
      if(L.sold>=L.sellable){ L.stage='done'; notify(`🎉 Sold through ${L.name}! Profit ${$0(L.net-L.allIn)}`); markSave(); }
    }
  }
}

function step(rdt){
  if(!booted) return;
  const dt=rdt*speed; t+=dt;
  simBusiness(dt);
  for(const a of agents){
    a.bob+=dt*9; if(a.bubbleT>0){ a.bubbleT-=dt; if(a.bubbleT<=0) a.bubble=null; }
    if(a.state==='walk'){
      let sp=2.4*dt;
      while(sp>0 && a.path.length){ const [tx,ty]=a.path[0], dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
        if(d<=sp){ a.x=tx; a.y=ty; sp-=d; a.path.shift(); } else { a.x+=dx/d*sp; a.y+=dy/d*sp; sp=0; } }
      if(!a.path.length){ a.state=a.next; if(a.state==='work') startTask(a); updStats(); }
    } else if(a.state==='work'){
      const waitingAI = a.task._ && a.task._.ai==='pending';
      a.prog=Math.min(waitingAI?.93:1, a.prog+dt/a.task.dur);
      if(waitingAI && a.prog>=.93 && !a.bubble){ a.bubble='🧠 thinking…'; a.bubbleT=1.4; }
      if(a.prog>=1){ finishTask(a); a.task=null;
        if(a.queue.length){ a.task=a.queue.shift(); a.prog=0; startTask(a); } else a.state='ready'; }
    } else {   // 'ready': sitting at the desk, starts the next task the moment one arrives
      a.x=a.seat.cx; a.y=a.seat.cy;
      if(a.queue.length){ a.task=a.queue.shift(); a.prog=0; a.state='work'; startTask(a); }
    }
  }
  leaderboard=[...agents].sort((p,q)=>q.done-p.done);
}

const Music=(()=>{
  let ctx=null, master=null, bus=null, wet=null, timer=null, step=0, nextT=0, rainSrc=null;
  // chord roots as MIDI, with 7th-chord voicings
  const PROG={ lofi:[[57,60,64,67],[53,57,60,64],[50,53,57,60],[55,59,62,65]],     // Am7 Fmaj7 Dm7 G7
               rain:[[52,55,59,62],[48,52,55,59],[45,48,52,55],[47,50,54,57]],     // Em7 Cmaj7 Am7 Bm7
               island:[[48,52,55,57],[53,57,60,62],[45,48,52,55],[55,59,62,64]] }; // C6 F6 Am7 G6
  const SCALE={ lofi:[69,72,74,76,79,81], rain:[64,67,69,71,74,76], island:[72,74,76,79,81,84] };
  const hz=m=>440*Math.pow(2,(m-69)/12);

    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; lp.Q.value=.3; lp.connect(master);
    bus=ctx.createGain(); bus.gain.value=1; bus.connect(lp);

    const d=ctx.createDelay(1.5); d.delayTime.value=.42; const fb=ctx.createGain(); fb.gain.value=.38; const df=ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=1200;
    wet=ctx.createGain(); wet.gain.value=.35; bus.connect(wet); wet.connect(d); d.connect(df); df.connect(fb); fb.connect(d); df.connect(lp);
    return true; }
  function tone(m,t,dur,type,peak,att){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=hz(m); o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+.05); }
  function rain(on){ if(on&&!rainSrc){ const n=ctx.sampleRate*2, b=ctx.createBuffer(1,n,ctx.sampleRate), x=b.getChannelData(0); let last=0; for(let i=0;i<n;i++){ last=(last+.02*(Math.random()*2-1))/1.02; x[i]=last*3.5; }

})();

          <div><b>${r.type==='lots'?`🏗️ Liquidation report · ${r.lots.length} lot${r.lots.length===1?'':'s'}`:r.type==='move'?`🔀 Move ${esc(r.product)} → ${MKT_LABEL[r.market]}`:r.type==='products'&&r.hot?`🔥 Hot deal: ${esc(r.leads[0]?r.leads[0].name:'')}`:r.type==='products'&&r.restock?`${r.alert?'🚨 Restock alert':'🔁 Restock'}: ${esc(r.leads[0]?r.leads[0].name:'')}`:r.type==='products'&&r.watch?`👀 Price drop${r.leads.length>1?'s':''}: ${r.leads.length>1?r.leads.length+' products':esc(r.leads[0]?r.leads[0].name:'')}`:r.type==='products'&&r.digest?`📋 ${esc(r.from)}'s daily report · ${r.leads.length} deal${r.leads.length===1?'':'s'}${(r.moves||[]).length?` + ${r.moves.length} move${r.moves.length>1?'s':''}`:''}`:r.type==='products'?`📋 ${r.from&&r.from!=='Scout'?esc(r.from)+"'s deals":'Product report'} · ${r.leads.length} match${r.leads.length===1?'':'es'}`:r.type==='brief'?`🗂️ ${esc(r.from)}: ${esc(r.title||'Report')}`:'📊 '+esc(r.headline||('Day '+r.d.day+' money report'))}</b>
          <span class="mut">from ${r.from}${r.type==='lots'?` · Day ${r.day} · ${!r.lots.length?'nothing passed':r.lots.some(l=>!l.decision)?r.lots.filter(l=>!l.decision).length+' waiting on you':'all decided'}`:r.type==='products'?` · Day ${r.day} · ${!r.leads.length&&!(r.moves||[]).length?'nothing passed':pend?pend+' waiting on you':'all decided'}`:r.type==='move'?` · Day ${r.day} · ${r.decision?'decided':'waiting on you'}`:` · Day ${r.d?r.d.day:r.day}`}</span></div><span class="chev">›</span></div>`; }).join('')
        : ((G.pendings||[]).length?'':`<p class="mut center">No reports yet. Scout is reviewing today’s leads. Check back soon, or tap Scout if they're slacking! 🔍</p>`);
    }
  } else if(tab==='settings'){ h=settingsView();
  } else if(tab==='ai'){ h=aiView();
  } else if(tab==='products'){
    const label={order:'Waiting for Stocky to order',to3pl:'In transit to 3PL',at3pl:'At 3PL: needs a shipment / listing',toFBA:'In transit to Amazon (FBA)',toWFS:'In transit to Walmart (WFS)',live:'Live & selling',done:'Sold out',suppressed:'Suppressed (IP complaint)',moved:'Moved to another marketplace'};
    const pct={order:.05,to3pl:.25,at3pl:.45,toFBA:.65,toWFS:.65,live:.85,done:1,suppressed:1,moved:1};
    const inMk=p=>invMk==='all'||(p.channel||'amazon')===invMk;
    const list=invMk==='lots'?[]:G.purchases.filter(inMk);
    h = invTabs() + (invMk==='lots'?'':invSummary(list)) + (invMk==='lots'?'':list.length ? list.map(p=>{
      const invested=p.qty*(p.cost+p.lead.prep), profit=p.net-invested;
      const L=p.comps&&p.comps.length?lowComp(p):Infinity;
      const ch=p.channel||'amazon';
      const extra = ['to3pl','toFBA','toWFS'].includes(p.stage) ? ` · ~${Math.max(0,p.t).toFixed(1)} days` : p.stage==='live' ? (ch==='amazon'?` · ${$$(p.price)} <span class="mut">(lowest offer ${isFinite(L)?$$(L):'none'})</span>`:` · ${$$(p.price)}${now()-(p.lastTended||0)>1.5?` <span class="r">${ch==='ebay'?'Eli':'Wally'} needs to tend listings</span>`:''}`) : '';
      const sel=invOpen===p.id;
      return `<div class="prod tap${sel?' sel':''}" data-a="inv" data-p="${p.id}"><div class="lh"><b>${p.name}</b><span class="mut nowrap">${MKT_ICON[ch]} ${MKT_LABEL[ch]} · ${p.qty} units</span></div>
        <div class="stage ${p.stage}">${p.stage==='live'?`Live on ${MKT_LABEL[ch]}`:label[p.stage]}${extra}</div>
        <div class="pbar"><i style="width:${pct[p.stage]*100}%" class="${p.stage}"></i></div>${p.walmart?`<div class="wm">🟦 Also on Walmart · ${p.walmart.sold} sold there</div>`:''}
        <div class="pr"><span>Sold <b>${p.sold}</b> · Left <b>${p.stock}</b></span><span>${profit>=0?`Profit <b class="g">${$0(profit)}</b>`:`Earned back <b>${$0(p.net)}</b> of ${$0(invested)}`}</span></div>
        ${(p.notes||[]).slice(0,3).map(n=>`<div class="note"><b>${n.who}:</b> ${esc(n.text)} ${srcTag(n.src)}</div>`).join('')}${sel?invDetail(p):''}</div>`; }).join('')
      + (G.messages.some(m=>m.done)?`<h4>💬 Recent buyer messages</h4>`+G.messages.filter(m=>m.done).slice(-6).reverse().map(m=>`<div class="note msg"><b>Buyer (${esc(m.product)}):</b> “${esc(m.text)}”<br><b>${m.who}:</b> ${String(m.action).toUpperCase()}. “${esc(m.reply)}” ${srcTag(m.src)}${m.note?`<br><span class="r">${esc(m.note)}</span>`:''}</div>`).join(''):'')
      : `<p class="mut center">${invMk==='all'?"No products yet. Approve leads from Scout's reports and they'll show up here as they move supplier → 3PL → marketplace.":`Nothing on ${MKT_LABEL[invMk]} yet.`}</p>`);
    if((invMk==='all'||invMk==='lots')&&G.lots&&G.lots.length) h+=`<h4>🏗️ Liquidation lots</h4>`+G.lots.map(lotRow).join('');
    else if(invMk==='lots') h+=`<p class="mut center">No liquidation lots yet.</p>`;
    if(invMk==='all') h=winnersCard()+h+watchCard();
  } else {
    const aiCard = `<div class="aicard ${G.aiOn&&AI?'on':''}"><div><b>🧠 AI brains: ${!aiReady?'checking…':!AI?'not available here':G.aiOn?'ON':'OFF'}</b>
      <span>${aiReady&&!AI?'Open this in the Claude app or on claude.ai to let agents think with Claude. Until then they use backup rules.':'When ON, every agent thinks with Claude: Scout picks products, Rex reads price charts, Ivy judges IP risk, Stocky writes POs, Lexi plans shipments, Penny sets prices, Hana answers buyers, Bea writes your report. It uses your Claude usage (<b>'+G.aiCalls+'</b> calls so far). When OFF, they follow simple backup rules.'}</span></div>
      ${AI?`<button class="hire" data-a="ai">${G.aiOn?'Turn off':'Turn on'}</button>`:''}</div>`;
    const saveCard = confirmNew
      ? `<div class="newcard"><b>🆕 Start a new game</b><span>This erases your current company. Practice with your real startup budget:</span>
          <label class="budget"><span>Starting budget</span><span class="dollar">$</span><input id="budgetIn" type="number" inputmode="decimal" min="100" max="1000000" step="50" value="${esc(budgetDraft)}"></label>
          <div class="row2"><button class="skipb" data-a="newcancel">Cancel</button><button class="buyb" data-a="newgo">Start new game</button></div>
          <span class="mut" id="budgetErr"></span></div>`
      : `<div class="savecard"><span>💾 ${esc(saveStatus)} · started with ${$0(START())}</span><button class="skipb" data-a="new">New game</button></div>`;
    h = `<div class="aicard"><div><b>📏 Rules mode</b><span>Agents follow your buy rules and simple built-in logic. No AI, so nothing uses your Claude usage.</span></div></div>` + (()=>{ const c=dailyCosts(); return `<div class="costcard"><b>💸 Monthly business costs</b><span>The bots themselves are free. These are what running the real business would cost, charged a little each day.</span>
      ${c.items.map(x=>`<div class="crow"><span>${esc(x.name)}<i>${esc(x.why)}</i></span><b>${$$(x.monthly)}/mo</b></div>`).join('')}
      <div class="crow tot"><span>Total</span><b>${$$(c.monthly)}/mo · ${$$(c.total)}/day</b></div></div>`; })() + ROLES.map((r,idx)=>{
      const a=hiredA(r.key);
      return `${r.key==='liq'?'<h4>🏬 Marketplace wing</h4>':''}<div class="team"><div class="av" style="background:${r.shirt}">${r.name[0]}</div>
        <div class="ti"><b>${r.name} · ${r.role}</b><span>${r.does}</span>${a?`<span class="mut">${a.done} tasks done · ${a.queue.length} waiting</span>`:''}</div>
        ${a?'<span class="hired">Hired</span>':`<button class="hire" data-a="hire" data-i="${idx}" ${G.cash<r.hire?'disabled':''}>Hire</button>`}</div>`; }).join('') + saveCard;
  }
  body.innerHTML=h;
}
body.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const act=b.dataset.a;
  if(act==='open'){ openRep=+b.dataset.r; renderSheet(); body.scrollTop=0; return; }
  if(act==='back'){ openRep=null; renderSheet(); return; }
  if(act==='hire'){ const r=ROLES[+b.dataset.i]; if(G.cash<r.hire) return; G.cash-=r.hire; G.total.overhead+=r.hire;
    agents.push(makeAgent(+b.dataset.i)); notify(`👋 You hired ${r.name} (${r.role})`);
    if(r.key==='ebay'){ G.lots.filter(L=>L.stage==='arrived').forEach(L=>queueTask('ebay',{kind:'listlot',title:'List lot on eBay: '+L.name,dur:8,ref:L.id})); }
    markSave(); renderSheet(); return; }
  if(act==='ai'){ toggleAI(); return; }
  if(act==='new'){ confirmNew=true; budgetDraft=String(START()); renderSheet(); body.scrollTop=body.scrollHeight; return; }
  if(act==='newcancel'){ confirmNew=false; renderSheet(); return; }
  if(act==='newgo'){ const v=Math.round(parseFloat(String(budgetDraft).replace(/[^0-9.]/g,''))||0);
    if(v<100||v>1000000){ const e=document.getElementById('budgetErr'); if(e) e.textContent='Enter an amount between $100 and $1,000,000.'; return; }
    confirmNew=false; newGame(v); return; }
  if(act==='music'){ PREFS.music=!PREFS.music; savePrefs(); if(PREFS.music) Music.start(); else Music.stop(); renderSheet(); return; }
  if(act==='mstyle'){ PREFS.style=b.dataset.s; savePrefs(); Music.restyle(); renderSheet(); return; }
  if(act==='readall'){ G.reports.forEach(r=>r.read=true); updStats(); renderSheet(); return; }
  if(act==='clearrep'){ const dailies=G.reports.filter(r=>r.type==='daily').slice(0,1);
    const open=r=> r.type==='products'?(r.leads.some(l=>!l.decision)||(r.moves||[]).some(v=>!v.decision)) : r.type==='lots'?r.lots.some(l=>!l.decision) : r.type==='move'?!r.decision : r.type==='daily'?dailies.includes(r) : !r.read;
    const before=G.reports.length; G.reports=G.reports.filter(open); log(`🧹 Cleared ${before-G.reports.length} finished report${before-G.reports.length===1?'':'s'}`); markSave(); updStats(); renderSheet(); return; }
  if(act==='unwatch'){ G.watch=(G.watch||[]).filter(w=>w.id!==+b.dataset.w); markSave(); renderSheet(); return; }
  if(act==='noop') return;
  if(act==='invmk'){ invMk=b.dataset.m; invOpen=null; invRep=null; renderSheet(); body.scrollTop=0; return; }
  if(act==='inv'){ const id=+b.dataset.p; if(invOpen===id) return; invOpen=id; if(!invRep||invRep.pid!==id) invRep=null; renderSheet(); return; }
  if(act==='invrestock'||act==='invrescan'){ const p=P(+b.dataset.p); if(!p) return; invScanning=p.id; invRep=null; const y=body.scrollTop; renderSheet(); body.scrollTop=y;
    setTimeout(()=>{ if(invScanning!==p.id) return; invScanning=null; const who=p.foundBy&&hiredA(p.foundBy)?p.foundBy:'scout';
      const {l}=restockScan(p,who,true); invRep={id:-p.id, pid:p.id, type:'products', restock:true, manual:true, owner:who, from:l.scout.who, leads:[l]};
      log(`🔁 You asked for a restock scan on ${p.name}`); const y2=body.scrollTop; renderSheet(); body.scrollTop=y2; },900); return; }
  const rep=(tab==='products'&&invRep&&b.closest('.invscan'))?invRep:G.reports.find(r=>r.id===openRep); if(!rep) return;
  if(act==='lotbuy'||act==='lotskip'){ const lt=rep.lots.find(x=>x.id===+b.dataset.l); if(!lt||lt.decision) return; const y=body.scrollTop;
    if(act==='lotbuy') approveLot(rep,lt); else { lt.decision={skip:true}; markSave(); } renderSheet(); body.scrollTop=y; return; }
  if((act==='mvgo'||act==='mvskip')&&b.dataset.mv){ const mv=(rep.moves||[]).find(v=>v.id===+b.dataset.mv); if(!mv||mv.decision) return; const y=body.scrollTop;
    if(act==='mvgo') approveMove(mv); else { mv.decision={skip:true}; markSave(); } renderSheet(); body.scrollTop=y; return; }
  if(act==='mvgo'||act==='mvskip'){ if(rep.type!=='move'||rep.decision) return; const y=body.scrollTop; if(act==='mvgo') approveMove(rep); else { rep.decision={skip:true}; markSave(); } renderSheet(); body.scrollTop=y; return; }
  if(!rep.leads) return; const l=rep.leads.find(x=>x.id===+b.dataset.l); if(!l||l.decision) return;
  if(act==='mkt'){ l.market=b.dataset.m; l.qty=suggestQtyM(l,l.market); }
  if(act==='src'){ const x=(l.sources||[]).find(z=>z.store===b.dataset.s); if(x&&!x.oos){ const m=l.market; l.store=x.store; l.cost=x.price; recalcLead(l); if(l.markets[m]) l.market=m; l.qty=suggestQtyM(l,l.market); } }
  const afford=Math.floor(Math.max(0,G.cash)/l.cost);
  if(act==='minus'){ l.qty=Math.max(0,l.qty-(l.qty>20?5:1)); }
  if(act==='plus'){ l.qty=Math.min(afford,l.qty+(l.qty>=20?5:1)); }
  if(act==='skip'){ delete l.pendingChange; skip(rep,l); return; }
  if(act==='buy'){ const y=body.scrollTop;
    if(l.hot&&now()>l.expiresAt){ l.decision={expired:true,gone:true}; markSave(); renderSheet(); body.scrollTop=y; return; }
    const r=recheck(l);
    if(r.gone){ l.decision={gone:true}; log(`🚫 ${l.name} sold out at ${l.store} before you bought`); markSave(); renderSheet(); body.scrollTop=y; return; }
    if(r.changed){ l.pendingChange={old:r.old}; l.qty=Math.min(l.qty,maxAfford(l)); renderSheet(); body.scrollTop=y; return; }
    approve(rep,l,l.qty); body.scrollTop=y; return; }
  if(act==='buyconfirm'){ const y=body.scrollTop; delete l.pendingChange; approve(rep,l,l.qty); body.scrollTop=y; return; }
  const y=body.scrollTop; renderSheet(); body.scrollTop=y;
});
btnWhistle.onclick=()=>{ let n=0; agents.forEach(a=>{ if(isSlacking(a)&&a.queue.length&&sendToWork(a,true)) n++; });
  log(n?`📣 Back to work! (${n} agent${n>1?'s':''})`:'📣 Nobody on break has work waiting'); };

// ================= AI on/off =================
async function toggleAI(){
  if(!AI){ notify('🧠 AI isn’t available in this view.'); return; }
  if(G.aiOn){ G.aiOn=false; notify('🧠 AI brains off. Agents use backup rules.'); markSave(); renderSheet(); updStats(); return; }
  G.aiOn=true; if(speed>4){ speed=4; speedBtn.textContent='4×'; }
  renderSheet(); updStats();
  const s=hiredA('scout')||agents[0];
  try{ const {out}=await think(s,'Team check-in',`${INTRO(s.name,s.role)}\nThe AI team just came online. Reply with only JSON: {"line":"one upbeat line (max 12 words) to Royce saying the team is online"}`,'quick');
    s.bubble=S(out&&out.line,80)||'AI team online! 🧠'; s.bubbleT=4; notify('🧠 AI brains ON. Open the 🧠 AI tab to watch every decision.'); }
  catch(e){ if(G.aiOn) notify('🧠 AI couldn’t start ('+((e&&e.code)||'error')+'). Agents use backup rules for now.'); }
  markSave(); renderSheet(); updStats();
}

// ================= start =================
const appEl=document.getElementById('app'); appEl.addEventListener('scroll',()=>{appEl.scrollTop=0;appEl.scrollLeft=0;}); window.addEventListener('scroll',()=>window.scrollTo(0,0));
resize(); updStats(); boot();
window.__ggn={purchases:()=>G.purchases.map(p=>({name:p.name,ch:p.channel,stage:p.stage,sold:p.sold,stock:p.stock})), reports:()=>G.reports.map(r=>({type:r.type,from:r.from,n:(r.leads||r.lots||[]).length})), pos:()=>agents.map(a=>({key:a.key,state:a.state,x:offX+a.hx*scale,y:offY+(a.hy+30)*scale})), leads:()=>G.reports.filter(r=>r.type==='products').map(r=>r.leads.map(l=>({from:r.from,pass:passesAny(l),best:l.best,market:l.market,roi:l.roi,ivy:l.ivy&&l.ivy.risk,rex:l.rex&&l.rex.stable}))), removed:()=>G.reports.filter(r=>r.type==='products').map(r=>r.removed)};
let last=performance.now();
function loop(nowT){ const dt=Math.min(.05,(nowT-last)/1000); last=nowT; step(dt); render(); updClock(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

})();
